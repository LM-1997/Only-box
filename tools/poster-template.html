<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Only-box 海报文字模板：上传背景图或使用品牌渐变，输入标题副标题，一键生成三套排版的海报图。">
  <title>海报文字模板｜Only-box</title>
  <link rel="stylesheet" href="../css/only-box.css">
  <link rel="stylesheet" href="../css/tool-common.css">
  <style>
  </style>
</head>
<body>
  <nav class="site-nav home-nav" aria-label="网站导航"><div class="nav-inner"><a class="brand-link" href="../index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5 12 3l7 3.5v11L12 21l-7-3.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m5.5 7 6.5 3.3L18.5 7M12 10.3V20" stroke="currentColor" stroke-width="1.8"/></svg></span>Only-box</a><div class="nav-links"><a href="../about.html">关于本项目</a></div></div></nav>
  <main>
    <div class="tool-area">
      <section class="panel">
        <div class="work-layout">
          <div>
            <div class="field">
              <label for="titleInput">主标题</label>
              <input id="titleInput" class="text-input" value="夏日Only展" maxlength="24">
            </div>
            <div class="field">
              <label for="subtitleInput">副标题</label>
              <input id="subtitleInput" class="text-input" value="8 月 30 日 · 展馆 B 区" maxlength="40">
            </div>
            <div class="field">
              <label for="bgInput">背景图（可选）</label>
              <div class="file-row">
                <label class="btn secondary" for="bgInput">选择图片<input id="bgInput" type="file" accept="image/*" hidden></label>
                <button class="btn secondary" id="clearBgBtn" type="button">清除背景图</button>
              </div>
              <p class="hint">不上传背景图时使用品牌绿渐变。背景图铺满画布（居中裁切），图片只在当前浏览器中处理，不会上传到服务器。</p>
            </div>
            <div class="field">
              <label id="templateLabel">文字模板</label>
              <div class="segmented" role="group" aria-labelledby="templateLabel" style="--seg-cols:repeat(3,1fr)">
                <button type="button" class="active" data-template="bottom" aria-pressed="true">底部横排</button>
                <button type="button" data-template="center" aria-pressed="false">居中大标题</button>
                <button type="button" data-template="top" aria-pressed="false">顶部横排</button>
              </div>
              <p class="hint">深色模板适合照片背景；浅色遮罩在亮色背景上更易读。</p>
            </div>
            <div class="field">
              <label id="toneLabel">遮罩色调</label>
              <div class="segmented" role="group" aria-labelledby="toneLabel">
                <button type="button" class="active" data-tone="dark" aria-pressed="true">深色遮罩</button>
                <button type="button" data-tone="light" aria-pressed="false">浅色遮罩</button>
              </div>
            </div>
          </div>
          <div>
            <div class="preview-head"><h2>预览</h2><button class="btn primary" id="downloadBtn" type="button">下载 PNG</button></div>
            <div class="canvas-wrap" style="--canvas-max-h:560px"><canvas id="posterCanvas" width="1080" height="1440" aria-label="海报预览"></canvas></div>
            <p class="status" id="status" aria-live="polite">输出 1080 × 1440（3:4），适合小红书等竖版平台。</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>Only-box · 海报文字模板</span><a href="../index.html">返回工具箱首页 →</a></div></footer>
  <script src="../js/mobile-image-upload.js"></script>
  <script src="../js/canvas-utils.js"></script>
  <script src="../js/ui/status.js?v=20260917-01"></script>
  <script src="../js/ui/segmented.js?v=20260917-01"></script>
  <script src="../js/ui/download.js?v=20260917-01"></script>
  <script src="../js/ui/upload.js?v=20260917-01"></script>
  <script src="../js/poster-template.js?v=20260917-01"></script>
</body>
</html>
