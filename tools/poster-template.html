<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Only-box 海报文字模板：上传背景图或使用品牌渐变，输入标题副标题，一键生成三套排版的海报图。">
  <title>海报文字模板｜Only-box</title>
  <link rel="stylesheet" href="../css/only-box.css">
  <style>
    :root{--tool-panel:rgba(255,255,255,.84);--tool-line:#dce4dd}
    [hidden]{display:none!important}
    .tool-area{width:min(1080px,calc(100% - 40px));margin:34px auto 0}
    .panel{margin-top:16px;padding:24px;border:1px solid var(--tool-line);border-radius:var(--ob-radius);background:var(--tool-panel);box-shadow:var(--ob-shadow)}
    .work-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:24px;align-items:start}
    .field{display:grid;gap:8px;margin-bottom:18px}
    .field label{font-size:13px;font-weight:750}
    .hint{margin:0;color:var(--ob-muted);font-size:12px;line-height:1.65}
    .text-input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--tool-line);border-radius:12px;color:var(--ob-ink);background:#fff;font-weight:650}
    .text-input:focus-visible{outline:3px solid rgba(35,107,79,.18);border-color:var(--ob-primary)}
    .segmented{display:inline-grid;grid-template-columns:repeat(3,1fr);padding:4px;border:1px solid var(--tool-line);border-radius:13px;background:#eef2ee}
    .segmented button{min-height:40px;padding:8px 12px;border:0;border-radius:9px;color:var(--ob-muted);background:transparent;font-size:13px;font-weight:800;cursor:pointer}
    .segmented button.active{color:#fff;background:var(--ob-primary);box-shadow:0 5px 14px rgba(35,107,79,.2)}
    .btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.16s}
    .btn.primary{color:#fff;background:var(--ob-primary);box-shadow:0 9px 22px rgba(35,107,79,.18)}
    .btn.primary:hover{background:var(--ob-primary-dark)}
    .btn.secondary{color:var(--ob-ink);background:#e8eee9}
    .file-row{display:flex;gap:10px;flex-wrap:wrap}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .preview-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
    .canvas-wrap{overflow:auto;max-height:560px;border:1px solid var(--tool-line);border-radius:14px;background:#e5e9e5}
    .canvas-wrap canvas{display:block;width:100%;height:auto}
    .status{min-height:20px;margin:12px 0 0;color:var(--ob-muted);font-size:12px}
    @media(max-width:860px){.work-layout{grid-template-columns:1fr}}
    @media(max-width:560px){.tool-area{width:calc(100% - 24px);margin-top:22px}.panel{padding:16px}.segmented{width:100%}}
  </style>
</head>
<body>
  <nav class="site-nav home-nav" aria-label="网站导航"><div class="nav-inner"><a class="brand-link" href="../index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5 12 3l7 3.5v11L12 21l-7-3.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m5.5 7 6.5 3.3L18.5 7M12 10.3V20" stroke="currentColor" stroke-width="1.8"/></svg></span>Only-box</a><div class="nav-links"><a href="../about.html">关于本项目</a></div></div></nav>
  <main>
    <div class="tool-area">
      <section class="panel">
        <div class="work-layout">
          <div>
            <div class="field">
              <label for="titleInput">主标题</label>
              <input id="titleInput" class="text-input" value="夏日Only展" maxlength="24">
            </div>
            <div class="field">
              <label for="subtitleInput">副标题</label>
              <input id="subtitleInput" class="text-input" value="8 月 30 日 · 展馆 B 区" maxlength="40">
            </div>
            <div class="field">
              <label for="bgInput">背景图（可选）</label>
              <div class="file-row">
                <label class="btn secondary" for="bgInput">选择图片<input id="bgInput" type="file" accept="image/*" hidden></label>
                <button class="btn secondary" id="clearBgBtn" type="button">清除背景图</button>
              </div>
              <p class="hint">不上传背景图时使用品牌绿渐变。背景图铺满画布（居中裁切），图片只在当前浏览器中处理，不会上传到服务器。</p>
            </div>
            <div class="field">
              <label id="templateLabel">文字模板</label>
              <div class="segmented" role="group" aria-labelledby="templateLabel">
                <button type="button" class="active" data-template="bottom" aria-pressed="true">底部横排</button>
                <button type="button" data-template="center" aria-pressed="false">居中大标题</button>
                <button type="button" data-template="top" aria-pressed="false">顶部横排</button>
              </div>
              <p class="hint">深色模板适合照片背景；浅色遮罩在亮色背景上更易读。</p>
            </div>
            <div class="field">
              <label id="toneLabel">遮罩色调</label>
              <div class="segmented" role="group" aria-labelledby="toneLabel" style="grid-template-columns:1fr 1fr">
                <button type="button" class="active" data-tone="dark" aria-pressed="true">深色遮罩</button>
                <button type="button" data-tone="light" aria-pressed="false">浅色遮罩</button>
              </div>
            </div>
          </div>
          <div>
            <div class="preview-head"><h2>预览</h2><button class="btn primary" id="downloadBtn" type="button">下载 PNG</button></div>
            <div class="canvas-wrap"><canvas id="posterCanvas" width="1080" height="1440" aria-label="海报预览"></canvas></div>
            <p class="status" id="status" aria-live="polite">输出 1080 × 1440（3:4），适合小红书等竖版平台。</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>Only-box · 海报文字模板</span><a href="../index.html">返回工具箱首页 →</a></div></footer>
  <script src="../js/mobile-image-upload.js"></script>
  <script src="../js/canvas-utils.js"></script>
  <script src="../js/poster-template.js"></script>
</body>
</html>
