<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Only-box 打印排版工具：把多张图片按网格排进 A4 页面，支持裁切填满与留白适应，导出打印用 PNG。">
  <title>打印排版 A4 拼版｜Only-box</title>
  <link rel="stylesheet" href="../css/only-box.css">
  <style>
    :root{--tool-panel:rgba(255,255,255,.84);--tool-line:#dce4dd}
    [hidden]{display:none!important}
    .tool-area{width:min(1080px,calc(100% - 40px));margin:34px auto 0}
    .panel{margin-top:16px;padding:24px;border:1px solid var(--tool-line);border-radius:var(--ob-radius);background:var(--tool-panel);box-shadow:var(--ob-shadow)}
    .settings-row{display:flex;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:18px}
    .field{display:grid;gap:8px}
    .field label{font-size:13px;font-weight:750}
    .field-help,.hint{color:var(--ob-muted);font-size:12px;line-height:1.65}
    .number-input{width:112px;height:44px;padding:8px 12px;border:1px solid var(--tool-line);border-radius:12px;color:var(--ob-ink);background:#fff;font-weight:750}
    .grid-switch{display:inline-grid;grid-template-columns:repeat(4,1fr);padding:4px;border:1px solid var(--tool-line);border-radius:13px;background:#eef2ee}
    .grid-switch button{min-width:70px;min-height:38px;padding:8px 10px;border:0;border-radius:9px;color:var(--ob-muted);background:transparent;font-size:13px;font-weight:800;cursor:pointer}
    .grid-switch button.active{color:#fff;background:var(--ob-primary);box-shadow:0 5px 14px rgba(35,107,79,.2)}
    .fill-switch{display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--tool-line);border-radius:13px;background:#eef2ee}
    .fill-switch button{min-height:38px;padding:8px 14px;border:0;border-radius:9px;color:var(--ob-muted);background:transparent;font-size:13px;font-weight:800;cursor:pointer}
    .fill-switch button.active{color:#fff;background:var(--ob-primary)}
    .dropzone{display:grid;min-height:150px;padding:24px;place-items:center;text-align:center;border:1.5px dashed #9bbcab;border-radius:16px;background:linear-gradient(135deg,rgba(223,240,230,.66),rgba(255,255,255,.78));cursor:pointer;transition:.16s}
    .dropzone:hover,.dropzone.drag{border-color:var(--ob-primary);background:var(--ob-primary-soft)}
    .dropzone strong{display:block;margin-bottom:4px;font-size:15px}
    .dropzone p{margin:0;color:var(--ob-muted);font-size:13px}
    .btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.16s}
    .btn.primary{color:#fff;background:var(--ob-primary);box-shadow:0 9px 22px rgba(35,107,79,.18)}
    .btn.primary:hover{background:var(--ob-primary-dark)}
    .btn.secondary{color:var(--ob-ink);background:#e8eee9}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .result-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
    .pages-strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px}
    .page-card{flex:0 0 auto;border:1px solid var(--tool-line);border-radius:12px;background:#fff;overflow:hidden}
    .page-card canvas{display:block;width:220px;height:auto;background:#fff}
    .page-meta{padding:8px 10px;font-size:12px;font-weight:750;color:var(--ob-muted)}
    .status{min-height:20px;margin:12px 0 0;color:var(--ob-muted);font-size:12px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    @media(max-width:560px){.tool-area{width:calc(100% - 24px);margin-top:22px}.panel{padding:16px}.grid-switch{grid-template-columns:repeat(2,1fr);width:100%}}
  </style>
</head>
<body>
  <nav class="site-nav home-nav" aria-label="网站导航"><div class="nav-inner"><a class="brand-link" href="../index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5 12 3l7 3.5v11L12 21l-7-3.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m5.5 7 6.5 3.3L18.5 7M12 10.3V20" stroke="currentColor" stroke-width="1.8"/></svg></span>Only-box</a><div class="nav-links"><a href="../about.html">关于本项目</a></div></div></nav>
  <main>
    <div class="tool-area">
      <section class="panel">
        <div class="settings-row">
          <div class="field">
            <label id="gridLabel">每页网格</label>
            <div class="grid-switch" role="group" aria-labelledby="gridLabel">
              <button type="button" class="active" data-grid="2x2" aria-pressed="true">2 × 2</button>
              <button type="button" data-grid="2x3" aria-pressed="false">2 × 3</button>
              <button type="button" data-grid="3x3" aria-pressed="false">3 × 3</button>
              <button type="button" data-grid="2x4" aria-pressed="false">2 × 4</button>
            </div>
            <span class="field-help" id="gridHelp">A4 竖版 300dpi：2480 × 3508px</span>
          </div>
          <div class="field">
            <label id="fillLabel">图片填充</label>
            <div class="fill-switch" role="group" aria-labelledby="fillLabel">
              <button type="button" class="active" data-fill="cover" aria-pressed="true">裁切填满</button>
              <button type="button" data-fill="contain" aria-pressed="false">留白适应</button>
            </div>
            <span class="field-help">裁切填满会裁掉超出部分；留白适应保留完整图片。</span>
          </div>
          <div class="field">
            <label for="marginInput">页边距（px）</label>
            <input id="marginInput" class="number-input" type="number" min="20" max="400" step="10" value="80" inputmode="numeric">
            <span class="field-help">默认 80px ≈ 300dpi 下 6.8mm。</span>
          </div>
          <div class="field">
            <label for="marksCheck" style="font-weight:750;font-size:13px;display:flex;align-items:center;gap:8px;min-height:44px"><input id="marksCheck" type="checkbox" checked> 输出裁切参考线</label>
            <span class="field-help">默认开启：格子四角的灰色虚线帮助打印后对齐裁切。</span>
          </div>
        </div>
        <label class="dropzone" id="dropzone" for="fileInput">
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <span><strong>点击选择或拖拽多张图片</strong><p>支持多选 · 图片仅在本地处理，不会上传到服务器</p></span>
        </label>
        <p class="status" id="status" aria-live="polite">选择图片后自动按网格排进 A4 页面。</p>
      </section>
      <section class="panel" id="resultPanel" hidden>
        <div class="result-head">
          <h2>排版结果</h2>
          <div class="toolbar">
            <button class="btn secondary" id="pagePrevBtn" type="button" disabled>上一页</button>
            <span class="field-help" id="pageIndicator">第 1 / 1 页</span>
            <button class="btn secondary" id="pageNextBtn" type="button" disabled>下一页</button>
            <button class="btn primary" id="downloadPageBtn" type="button">下载当前页 PNG</button>
            <button class="btn primary" id="zipBtn" type="button">全部页面打包 ZIP</button>
          </div>
        </div>
        <div class="pages-strip" id="pagesStrip"></div>
        <p class="hint">参考线画在格子四角，方便打印后沿虚线裁切；不需要时可以关闭。</p>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>Only-box · 打印排版 A4 拼版</span><a href="../index.html">返回工具箱首页 →</a></div></footer>
  <script src="../js/mobile-image-upload.js"></script>
  <script src="../js/canvas-utils.js"></script>
  <script src="../js/print-layout.js"></script>
</body>
</html>
