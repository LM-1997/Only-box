<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Only-box 倒计时图生成：输入目标日期，生成活动倒计时宣发图，支持连续多天批量出图。">
  <title>倒计时图生成｜Only-box</title>
  <link rel="stylesheet" href="../css/only-box.css">
  <style>
    :root{--tool-panel:rgba(255,255,255,.84);--tool-line:#dce4dd}
    [hidden]{display:none!important}
    .tool-area{width:min(1080px,calc(100% - 40px));margin:34px auto 0}
    .panel{margin-top:16px;padding:24px;border:1px solid var(--tool-line);border-radius:var(--ob-radius);background:var(--tool-panel);box-shadow:var(--ob-shadow)}
    .work-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:24px;align-items:start}
    .field{display:grid;gap:8px;margin-bottom:18px}
    .field label{font-size:13px;font-weight:750}
    .field-help,.hint{color:var(--ob-muted);font-size:12px;line-height:1.65}
    .text-input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--tool-line);border-radius:12px;color:var(--ob-ink);background:#fff;font-weight:650}
    .date-input{width:200px;height:44px;padding:8px 12px;border:1px solid var(--tool-line);border-radius:12px;color:var(--ob-ink);background:#fff;font-weight:750}
    .check-line{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:750}
    .file-row{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.16s}
    .btn.primary{color:#fff;background:var(--ob-primary);box-shadow:0 9px 22px rgba(35,107,79,.18)}
    .btn.primary:hover{background:var(--ob-primary-dark)}
    .btn.secondary{color:var(--ob-ink);background:#e8eee9}
    .btn.block{width:100%}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .preview-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
    .canvas-wrap{overflow:auto;max-height:560px;border:1px solid var(--tool-line);border-radius:14px;background:#e5e9e5}
    .canvas-wrap canvas{display:block;width:100%;height:auto}
    .status{min-height:20px;margin:12px 0 0;color:var(--ob-muted);font-size:12px}
    @media(max-width:860px){.work-layout{grid-template-columns:1fr}}
    @media(max-width:560px){.tool-area{width:calc(100% - 24px);margin-top:22px}.panel{padding:16px}}
  </style>
</head>
<body>
  <nav class="site-nav home-nav" aria-label="网站导航"><div class="nav-inner"><a class="brand-link" href="../index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5 12 3l7 3.5v11L12 21l-7-3.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m5.5 7 6.5 3.3L18.5 7M12 10.3V20" stroke="currentColor" stroke-width="1.8"/></svg></span>Only-box</a><div class="nav-links"><a href="../about.html">关于本项目</a></div></div></nav>
  <main>
    <div class="tool-area">
      <section class="panel">
        <div class="work-layout">
          <div>
            <div class="field">
              <label for="targetDate">目标日期</label>
              <input id="targetDate" class="date-input" type="date">
              <span class="field-help">倒计时按“自然日”计算：今天夜里 23:59 与早上 6:00 算出的天数一致，不会出现差一天。</span>
            </div>
            <div class="field">
              <label for="eventName">活动名称（可选）</label>
              <input id="eventName" class="text-input" value="" maxlength="24" placeholder="例如：夏日Only展">
            </div>
            <div class="field">
              <label for="bgInput">背景图（可选）</label>
              <div class="file-row">
                <label class="btn secondary" for="bgInput">选择图片<input id="bgInput" type="file" accept="image/*" hidden></label>
                <button class="btn secondary" id="clearBgBtn" type="button">清除背景图</button>
              </div>
              <p class="hint">不上传时使用品牌绿渐变背景。图片只在当前浏览器中处理，不会上传到服务器。</p>
            </div>
            <div class="field">
              <label class="check-line" for="expiredHide"><input id="expiredHide" type="checkbox"> 过期后隐藏倒计时文字（显示“已结束”）</label>
              <span class="field-help">关闭时过期显示“已结束”；开启时直接隐藏天数，只保留活动名。</span>
            </div>
            <div class="field">
              <label for="seriesCount">批量系列图：从目标日前几天开始（0–14 天）</label>
              <input id="seriesCount" class="date-input" type="number" min="0" max="14" step="1" value="0" inputmode="numeric">
              <span class="field-help">例如填 7：生成“还有 7 天”到“还有 0 天”共 8 张，适合提前连更。0 表示只生成当前这一张。</span>
            </div>
            <button class="btn primary block" id="generateBtn" type="button">生成倒计时图</button>
            <p class="status" id="genStatus" aria-live="polite"></p>
          </div>
          <div>
            <div class="preview-head"><h2>预览与导出</h2><button class="btn primary" id="zipBtn" type="button" disabled>打包下载 ZIP</button></div>
            <div class="canvas-wrap"><canvas id="previewCanvas" width="1080" height="1350" aria-label="倒计时图预览"></canvas></div>
            <p class="status" id="status" aria-live="polite">输出 1080 × 1350（4:5）竖版。</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>Only-box · 倒计时图生成</span><a href="../index.html">返回工具箱首页 →</a></div></footer>
  <script src="../js/mobile-image-upload.js"></script>
  <script src="../js/canvas-utils.js"></script>
  <script src="../js/countdown-image.js"></script>
</body>
</html>
