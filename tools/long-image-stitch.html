<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Only-box 长图拼接工具：多选图片、点按排序，在浏览器本地生成竖向或横向长图。">
  <title>长图拼接｜Only-box</title>
  <link rel="stylesheet" href="../css/only-box.css">
  <link rel="stylesheet" href="../css/long-image-stitch.css">
</head>
<body class="stitch-page">
  <nav class="site-nav home-nav" aria-label="网站导航">
    <div class="nav-inner">
      <a class="brand-link" href="../index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5 12 3l7 3.5v11L12 21l-7-3.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m5.5 7 6.5 3.3L18.5 7M12 10.3V20" stroke="currentColor" stroke-width="1.8"/></svg></span>Only-box</a>
      <div class="nav-links"><a href="../about.html">关于本项目</a></div>
    </div>
  </nav>

  <main>
    <div class="page-shell">
      <section class="stitch-workbench" aria-label="长图拼接工作区">
        <section class="stitch-panel upload-panel">
          <div class="panel-heading"><div><p class="panel-kicker">Images</p><h2>添加图片</h2></div><span class="privacy-badge">仅本地处理</span></div>
          <label class="stitch-dropzone" id="dropzone" for="fileInput">
            <input id="fileInput" type="file" accept="image/*" multiple hidden>
            <span class="dropzone-icon" aria-hidden="true">＋</span>
            <span><strong>点这里多选图片</strong><small>支持 JPEG、PNG、WebP、HEIC/HEIF 等常见格式</small></span>
          </label>
          <p class="status-line" id="loadStatus" aria-live="polite">还没有选择图片。</p>
        </section>

        <section class="stitch-panel settings-panel">
          <div class="panel-heading"><div><p class="panel-kicker">Layout</p><h2>拼接设置</h2></div></div>
          <div class="direction-switch" role="group" aria-label="拼接方向">
            <button class="direction-btn active" id="verticalBtn" type="button" aria-pressed="true"><span aria-hidden="true">↕</span>竖向拼接</button>
            <button class="direction-btn" id="horizontalBtn" type="button" aria-pressed="false"><span aria-hidden="true">↔</span>横向拼接</button>
          </div>
          <div class="size-setting">
            <div class="size-setting-head">
              <label class="size-label" for="crossSizeInput"><span id="crossSizeLabel">输出宽度</span><em>px</em></label>
              <button class="size-clear" id="sizeClearBtn" type="button" hidden>恢复自动</button>
            </div>
            <input id="crossSizeInput" type="number" min="1" max="100000" step="100" placeholder="自动（取最小宽度）" inputmode="numeric">
            <p class="size-hint" id="sizeHint">留空时自动取所有图片的最小宽度；手动设置后强制按该宽度输出，不会自动缩小。</p>
          </div>
          <div class="dimension-readout" id="dimensionReadout"><strong>等待图片</strong><span>添加两张或更多图片后可生成</span></div>
          <button class="primary-action" id="generateBtn" type="button" disabled>至少需要 2 张图片</button>
          <p class="status-line" id="generateStatus" aria-live="polite"></p>
        </section>
      </section>

      <section class="stitch-panel sequence-panel" id="sequencePanel" hidden>
        <div class="sequence-head">
          <div><p class="panel-kicker">Tap to order</p><h2>图片顺序</h2><p id="sortHelp">当前按添加顺序排列。需要调整时，进入点按排序。</p></div>
          <div class="sequence-actions">
            <button class="small-btn primary" id="sortBtn" type="button">重新点按排序</button>
            <button class="small-btn" id="resetOrderBtn" type="button">恢复添加顺序</button>
            <button class="small-btn danger" id="clearAllBtn" type="button">清空全部</button>
          </div>
        </div>
        <div class="image-grid" id="imageGrid" role="list" aria-label="待拼接图片"></div>
      </section>

      <section class="stitch-panel result-panel" id="resultPanel" hidden>
        <div class="result-head">
          <div><p class="panel-kicker">Result</p><h2>拼接结果</h2><p id="resultMeta"></p></div>
          <a class="download-action" id="downloadLink" download="only-box-long-image.png">下载 PNG</a>
        </div>
        <div class="preview-toolbar" aria-label="预览缩放工具">
          <span class="preview-toolbar-label">预览缩放</span>
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOutBtn" type="button" aria-label="缩小预览">−</button>
            <input id="zoomRange" type="range" min="25" max="400" step="25" value="100" aria-label="预览缩放比例">
            <button class="zoom-btn" id="zoomInBtn" type="button" aria-label="放大预览">＋</button>
            <output id="zoomValue" for="zoomRange">100%</output>
            <button class="fit-btn" id="fitWidthBtn" type="button">适应宽度</button>
          </div>
        </div>
        <div class="result-viewport vertical" id="resultViewport"><img id="resultImage" alt="长图拼接结果"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer"><div class="footer-inner"><span>Only-box · 长图拼接</span><a href="../index.html">返回工具箱首页 →</a></div></footer>
  <script src="../js/mobile-image-upload.js"></script>
  <script src="../js/long-image-layout.js"></script>
  <script src="../js/long-image-stitch.js"></script>
</body>
</html>
